<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌱 匿名で本音投票</title>
  <meta name="theme-color" content="#e8f5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    :root {
      --bg: #f0f7f0;
      --card: #ffffff;
      --primary: #43a047;
      --primary-dark: #2e7d32;
      --primary-soft: #e8f5e9;
      --primary-hover: #66bb6a;
      --border: #e5e5e5;
      --text: #1c1c1c;
      --text-secondary: #555;
      --text-muted: #888;
      --radius: 22px;
      --radius-sm: 16px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.045);
      --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 24px 18px 56px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(56px, env(safe-area-inset-bottom));
      max-width: 480px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header */
    header {
      margin-bottom: 32px;
      padding-top: 4px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 0.96rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    /* Card */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 26px 22px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease;
    }

    /* Question */
    .question {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 26px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    /* Options */
    .option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 17px 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-size: 0.98rem;
      background: #fff;
      user-select: none;
      position: relative;
    }

    .option:last-of-type {
      margin-bottom: 4px;
    }

    .option:active {
      transform: scale(0.982);
    }

    .option:hover {
      border-color: #a5d6a7;
      background: #f4faf4;
    }

    .option.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .option input {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2.5px solid #c0c0c0;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 0.2s ease;
      background: white;
    }

    .option.selected input {
      border-color: var(--primary);
      background: var(--primary);
    }

    .option.selected input::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .option strong {
      color: var(--primary-dark);
      font-weight: 700;
      margin-right: 3px;
    }

    .option span {
      flex: 1;
      padding-top: 1px;
    }

    /* Button */
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 17px 24px;
      border-radius: 999px;
      font-size: 1.06rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 18px;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 14px rgba(67, 160, 71, 0.25);
    }

    button:active {
      transform: scale(0.975);
      box-shadow: 0 2px 8px rgba(67, 160, 71, 0.2);
    }

    button:hover {
      background: var(--primary-dark);
    }

    /* Note */
    .note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 18px;
      background: #f6f6f6;
      padding: 13px 15px;
      border-radius: 14px;
      line-height: 1.55;
    }

    /* My result */
    .my-result {
      background: var(--primary-soft);
      border-radius: var(--radius-sm);
      padding: 20px 18px;
      margin-bottom: 22px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-dark);
      display: none;
      animation: fadeUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Results */
    h2 {
      font-size: 1.13rem;
      font-weight: 600;
      margin-bottom: 18px;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .result-bar {
      margin-bottom: 18px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.93rem;
      margin-bottom: 7px;
      color: var(--text-secondary);
    }

    .bar-label span:last-child {
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
    }

    .bar {
      height: 11px;
      background: #e9e9e9;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #81c784, #43a047);
      border-radius: 99px;
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      min-width: 0;
    }

    .total-votes {
      margin-top: 6px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .comment {
      margin-top: 16px;
      font-size: 0.96rem;
      color: var(--primary-dark);
      font-weight: 500;
      line-height: 1.5;
    }

    /* Opinion section */
    .section-desc {
      font-size: 0.91rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 96px;
      padding: 15px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      resize: none;
      font-size: 1rem;
      font-family: inherit;
      margin-bottom: 14px;
      transition: all 0.2s ease;
      background: #fafafa;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(67, 160, 71, 0.12);
    }

    textarea::placeholder {
      color: #aaa;
    }

    .opinion {
      background: #f1f8e9;
      padding: 15px 17px;
      border-radius: 15px;
      margin-bottom: 12px;
      font-size: 0.96rem;
      line-height: 1.55;
      animation: fadeUp 0.35s ease;
    }

    .opinion-meta {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 7px;
    }

    /* Empty state */
    .empty {
      color: var(--text-muted);
      font-size: 0.93rem;
      text-align: center;
      padding: 18px 0 8px;
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 44px;
      padding-bottom: 8px;
      letter-spacing: 0.02em;
    }

    /* Toast-like feedback */
    .toast {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 30, 30, 0.88);
      color: white;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <h1><span>🌱</span> 匿名で本音投票</h1>
    <p class="subtitle">ちょっと本音で答えよう（誰にもバレません）</p>
  </header>

  <!-- 投票 -->
  <section class="card">
    <div class="question">正直、今一番「めんどくさい…」と思ってることは？</div>

    <label class="option" id="optA">
      <input type="radio" name="vote" value="A">
      <span><strong>A</strong>　人間関係（付き合い・連絡・気を使う系）</span>
    </label>
    <label class="option" id="optB">
      <input type="radio" name="vote" value="B">
      <span><strong>B</strong>　お金（支払い・貯金・将来設計）</span>
    </label>
    <label class="option" id="optC">
      <input type="radio" name="vote" value="C">
      <span><strong>C</strong>　仕事（忙しさ・ストレス・人間関係含む）</span>
    </label>
    <label class="option" id="optD">
      <input type="radio" name="vote" value="D">
      <span><strong>D</strong>　自分自身（やる気・体調・メンタル）</span>
    </label>
    <label class="option" id="optE">
      <input type="radio" name="vote" value="E">
      <span><strong>E</strong>　特にない（意外と平和）</span>
    </label>

    <button id="voteBtn" onclick="submitVote()">匿名で投票する</button>

    <div class="note">
      ※この投票はあなたの端末内だけで記録されます。<br>
      他の人と結果は共有されません（完全にローカルです）
    </div>
  </section>

  <!-- 結果 -->
  <section class="card">
    <div class="my-result" id="myResult"></div>
    <h2>みんなの結果（この端末内）</h2>
    <div id="results"></div>
  </section>

  <!-- 一言 -->
  <section class="card">
    <h2>一言愚痴ってもOK</h2>
    <p class="section-desc">短い一言でどうぞ。匿名です。</p>
    <textarea id="opinionText" placeholder="例：もう連絡来るのやめろ…" maxlength="120"></textarea>
    <button onclick="submitOpinion()">匿名で投稿する</button>
  </section>

  <!-- みんなの一言 -->
  <section class="card">
    <h2>みんなの一言</h2>
    <div id="opinionsList">
      <p class="empty">まだ誰も愚痴ってません</p>
    </div>
  </section>

  <footer>匿名で本音投票 — prototype</footer>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_VOTES = 'hc_votes_v2';
    const STORAGE_OPINIONS = 'hc_opinions_v2';
    const STORAGE_MY_VOTE = 'hc_my_vote_v2';

    const labels = {
      A: '人間関係',
      B: 'お金',
      C: '仕事',
      D: '自分自身',
      E: '特にない'
    };

    const resultText = {
      A: '人間関係めんどい派',
      B: 'お金めんどい派',
      C: '仕事めんどい派',
      D: '自分自身めんどい派',
      E: '意外と平和派'
    };

    const comments = {
      A: 'みんな人間関係で消耗してる…わかる',
      B: 'お金の話はリアルすぎる',
      C: '仕事が一番めんどいって人、多そう',
      D: '自分との戦いが一番しんどい説',
      E: '平和な人がいる…いいな'
    };

    function getVotes() {
      return JSON.parse(localStorage.getItem(STORAGE_VOTES) || '{"A":0,"B":0,"C":0,"D":0,"E":0}');
    }

    function saveVotes(v) {
      localStorage.setItem(STORAGE_VOTES, JSON.stringify(v));
    }

    function getOpinions() {
      return JSON.parse(localStorage.getItem(STORAGE_OPINIONS) || '[]');
    }

    function saveOpinions(list) {
      localStorage.setItem(STORAGE_OPINIONS, JSON.stringify(list.slice(0, 30))); // 最新30件まで
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2100);
    }

    function submitVote() {
      const selected = document.querySelector('input[name="vote"]:checked');
      if (!selected) {
        showToast('どれか選んでください');
        return;
      }

      const choice = selected.value;
      const prev = localStorage.getItem(STORAGE_MY_VOTE);

      let votes = getVotes();
      if (prev && votes[prev] > 0) votes[prev]--;
      votes[choice]++;
      saveVotes(votes);
      localStorage.setItem(STORAGE_MY_VOTE, choice);

      // UI更新
      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      document.getElementById('opt' + choice).classList.add('selected');

      const myResult = document.getElementById('myResult');
      myResult.style.display = 'block';
      myResult.innerHTML = `あなたは今<br>「${resultText[choice]}」です`;

      renderResults();
      showToast('投票しました');
    }

    function renderResults() {
      const votes = getVotes();
      const total = Object.values(votes).reduce((a, b) => a + b, 0) || 1;
      const totalCount = Object.values(votes).reduce((a, b) => a + b, 0);

      let html = '';
      for (const key of ['A', 'B', 'C', 'D', 'E']) {
        const percent = Math.round((votes[key] / total) * 100);
        html += `
          <div class="result-bar">
            <div class="bar-label">
              <span>${key}　${labels[key]}</span>
              <span>${percent}%（${votes[key]}）</span>
            </div>
            <div class="bar">
              <div class="bar-fill" style="width:${percent}%"></div>
            </div>
          </div>
        `;
      }

      html += `<p class="total-votes">合計 ${totalCount} 票</p>`;

      const maxKey = Object.keys(votes).reduce((a, b) => votes[a] > votes[b] ? a : b);
      if (votes[maxKey] > 0) {
        html += `<p class="comment">→ ${comments[maxKey]}</p>`;
      }

      document.getElementById('results').innerHTML = html;
    }

    function submitOpinion() {
      const text = document.getElementById('opinionText').value.trim();
      if (!text) {
        showToast('何か書いてください');
        return;
      }

      const list = getOpinions();
      list.unshift({
        text: text.slice(0, 120),
        time: new Date().toLocaleString('ja-JP', {
          month: 'numeric',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        })
      });
      saveOpinions(list);
      document.getElementById('opinionText').value = '';
      renderOpinions();
      showToast('投稿しました');
    }

    function renderOpinions() {
      const list = getOpinions();
      const container = document.getElementById('opinionsList');

      if (list.length === 0) {
        container.innerHTML = '<p class="empty">まだ誰も愚痴ってません</p>';
        return;
      }

      container.innerHTML = list.map(op => `
        <div class="opinion">
          ${escapeHtml(op.text)}
          <div class="opinion-meta">${op.time}</div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 選択時に即座に見た目反映
    document.querySelectorAll('input[name="vote"]').forEach(radio => {
      radio.addEventListener('change', () => {
        document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
        if (radio.checked) {
          document.getElementById('opt' + radio.value).classList.add('selected');
        }
      });
    });

    // Enterキーで投稿（textarea）
    document.getElementById('opinionText').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitOpinion();
      }
    });

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      const myVote = localStorage.getItem(STORAGE_MY_VOTE);
      if (myVote) {
        const radio = document.querySelector(`input[value="${myVote}"]`);
        if (radio) {
          radio.checked = true;
          document.getElementById('opt' + myVote).classList.add('selected');
          const myResult = document.getElementById('myResult');
          myResult.style.display = 'block';
          myResult.innerHTML = `あなたは今<br>「${resultText[myVote]}」です`;
        }
      }
      renderResults();
      renderOpinions();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 匿名で本音投票</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f0f7f0;
      color: #222;
      line-height: 1.6;
      padding: 20px;
      max-width: 640px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .subtitle { color: #555; margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .question { font-size: 1.15rem; font-weight: 600; margin-bottom: 18px; line-height: 1.5; }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid #e5e5e5;
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.98rem;
    }
    .option:hover { border-color: #81c784; background: #f1f8e9; }
    .option.selected { border-color: #43a047; background: #e8f5e9; }
    .option input { transform: scale(1.25); }
    button {
      background: #43a047;
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 999px;
      font-size: 1.05rem;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      font-weight: 600;
    }
    button:hover { background: #388e3c; }
    .note {
      font-size: 0.82rem;
      color: #666;
      margin-top: 14px;
      background: #f5f5f5;
      padding: 10px 14px;
      border-radius: 10px;
    }
    .result-bar { margin: 12px 0; }
    .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .bar {
      height: 14px;
      background: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #66bb6a;
      border-radius: 8px;
      transition: width 0.5s ease;
    }
    .my-result {
      background: #e8f5e9;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      display: none;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      resize: vertical;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .opinion {
      background: #f1f8e9;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .opinion-meta {
      font-size: 0.78rem;
      color: #777;
      margin-top: 4px;
    }
    footer {
      text-align: center;
      color: #888;
      font-size: 0.82rem;
      margin-top: 36px;
    }
  </style>
</head>
<body>

  <h1>🌱 匿名で本音投票</h1>
  <p class="subtitle">ちょっと本音で答えよう（誰にもバレません）</p>

  <div class="card">
    <div class="question">正直、今一番「めんどくさい…」と思ってることは？</div>

    <label class="option" id="optA">
      <input type="radio" name="vote" value="A">
      <span><strong>A</strong>　人間関係（付き合い・連絡・気を使う系）</span>
    </label>
    <label class="option" id="optB">
      <input type="radio" name="vote" value="B">
      <span><strong>B</strong>　お金（支払い・貯金・将来設計）</span>
    </label>
    <label class="option" id="optC">
      <input type="radio" name="vote" value="C">
      <span><strong>C</strong>　仕事（忙しさ・ストレス・人間関係含む）</span>
    </label>
    <label class="option" id="optD">
      <input type="radio" name="vote" value="D">
      <span><strong>D</strong>　自分自身（やる気・体調・メンタル）</span>
    </label>
    <label class="option" id="optE">
      <input type="radio" name="vote" value="E">
      <span><strong>E</strong>　特にない（意外と平和）</span>
    </label>

    <button onclick="submitVote()">匿名で投票する</button>

    <div class="note">
      ※この投票はあなたのブラウザ内だけで記録されます。<br>
      他の人と結果は共有されません（完全にローカルです）
    </div>
  </div>

  <div class="card">
    <div class="my-result" id="myResult"></div>
    <h2 style="font-size:1.15rem; margin-bottom:12px;">みんなの結果（このブラウザ内）</h2>
    <div id="results"></div>
  </div>

  <div class="card">
    <h2 style="font-size:1.15rem; margin-bottom:8px;">一言愚痴ってもOK</h2>
    <p style="font-size:0.9rem; color:#555; margin-bottom:12px;">短い一言でどうぞ。匿名です。</p>
    <textarea id="opinionText" placeholder="例：もう連絡来るのやめろ…"></textarea>
    <button onclick="submitOpinion()">匿名で投稿する</button>
  </div>

  <div class="card">
    <h2 style="font-size:1.15rem; margin-bottom:12px;">みんなの一言</h2>
    <div id="opinionsList">
      <p style="color:#888;">まだ誰も愚痴ってません</p>
    </div>
  </div>

  <footer>匿名で本音投票 — prototype</footer>

  <script>
    const STORAGE_VOTES = 'hc3_votes';
    const STORAGE_OPINIONS = 'hc3_opinions';
    const STORAGE_MY_VOTE = 'hc3_my_vote';

    const labels = {
      A: '人間関係',
      B: 'お金',
      C: '仕事',
      D: '自分自身',
      E: '特にない'
    };

    const resultText = {
      A: '人間関係めんどい派',
      B: 'お金めんどい派',
      C: '仕事めんどい派',
      D: '自分自身めんどい派',
      E: '意外と平和派'
    };

    const comments = {
      A: 'みんな人間関係で消耗してる…わかる',
      B: 'お金の話はリアルすぎる',
      C: '仕事が一番めんどいって人、多そう',
      D: '自分との戦いが一番しんどい説',
      E: '平和な人がいる…いいな'
    };

    function getVotes() {
      return JSON.parse(localStorage.getItem(STORAGE_VOTES) || '{"A":0,"B":0,"C":0,"D":0,"E":0}');
    }
    function saveVotes(v) {
      localStorage.setItem(STORAGE_VOTES, JSON.stringify(v));
    }
    function getOpinions() {
      return JSON.parse(localStorage.getItem(STORAGE_OPINIONS) || '[]');
    }
    function saveOpinions(list) {
      localStorage.setItem(STORAGE_OPINIONS, JSON.stringify(list));
    }

    function submitVote() {
      const selected = document.querySelector('input[name="vote"]:checked');
      if (!selected) {
        alert('どれか選んでください');
        return;
      }
      const choice = selected.value;
      const prev = localStorage.getItem(STORAGE_MY_VOTE);

      let votes = getVotes();
      if (prev && votes[prev] > 0) votes[prev]--;
      votes[choice]++;
      saveVotes(votes);
      localStorage.setItem(STORAGE_MY_VOTE, choice);

      document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
      document.getElementById('opt' + choice).classList.add('selected');

      const myResult = document.getElementById('myResult');
      myResult.style.display = 'block';
      myResult.innerHTML = `あなたは今<br>「${resultText[choice]}」です`;

      renderResults();
    }

    function renderResults() {
      const votes = getVotes();
      const total = Object.values(votes).reduce((a,b)=>a+b,0) || 1;

      let html = '';
      for (const key of ['A','B','C','D','E']) {
        const percent = Math.round((votes[key] / total) * 100);
        html += `
          <div class="result-bar">
            <div class="bar-label">
              <span>${key}　${labels[key]}</span>
              <span>${percent}%（${votes[key]}）</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${percent}%"></div></div>
          </div>
        `;
      }
      html += `<p style="margin-top:14px; font-size:0.9rem; color:#555;">合計 ${Object.values(votes).reduce((a,b)=>a+b,0)} 票</p>`;
      
      const maxKey = Object.keys(votes).reduce((a,b) => votes[a] > votes[b] ? a : b);
      if (votes[maxKey] > 0) {
        html += `<p style="margin-top:10px; font-size:0.95rem; color:#2e7d32;">→ ${comments[maxKey]}</p>`;
      }

      document.getElementById('results').innerHTML = html;
    }

    function submitOpinion() {
      const text = document.getElementById('opinionText').value.trim();
      if (!text) {
        alert('何か書いてください');
        return;
      }
      const list = getOpinions();
      list.unshift({ text, time: new Date().toLocaleString('ja-JP') });
      saveOpinions(list);
      document.getElementById('opinionText').value = '';
      renderOpinions();
    }

    function renderOpinions() {
      const list = getOpinions();
      const container = document.getElementById('opinionsList');
      if (list.length === 0) {
        container.innerHTML = '<p style="color:#888;">まだ誰も愚痴ってません</p>';
        return;
      }
      container.innerHTML = list.map(op => `
        <div class="opinion">
          ${op.text}
          <div class="opinion-meta">${op.time}</div>
        </div>
      `).join('');
    }

    window.onload = () => {
      const myVote = localStorage.getItem(STORAGE_MY_VOTE);
      if (myVote) {
        const radio = document.querySelector(`input[value="${myVote}"]`);
        if (radio) {
          radio.checked = true;
          document.getElementById('opt' + myVote).classList.add('selected');
          document.getElementById('myResult').style.display = 'block';
          document.getElementById('myResult').innerHTML = `あなたは今<br>「${resultText[myVote]}」です`;
        }
      }
      renderResults();
      renderOpinions();
    };
  </script>
</body>
</html>
